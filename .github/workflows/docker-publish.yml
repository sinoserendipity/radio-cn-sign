name: Docker

# radio.cn 云听 m3u8 签名代理: 多架构镜像推 GHCR + 离线 tar 包。
#
#   push 到 main      -> :edge + :sha-<short>
#   tag v1.2.3        -> :1.2.3, :1.2, :latest, :sha-<short>
#   pull request      -> 只构建 linux/amd64, 不推送, 本地启动跑 smoke test
#   workflow_dispatch -> 同分支 push
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  image:
    name: Build ${{ github.event_name == 'pull_request' && 'linux/amd64 (no push)' || 'linux/amd64 + linux/arm64' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Syntax check
        # 纯标准库, 但语法错误只会在容器启动时才炸, 这里先拦下来
        run: python3 -m py_compile app.py

      - name: Resolve image name
        # ghcr.io 拒收大写路径; github.repository 保留仓库原始大小写
        run: echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=radio-cn-sign
          cache-to: type=gha,mode=max,scope=radio-cn-sign
          provenance: true
          sbom: true

      - name: Smoke test (PR build)
        # 多架构 push 的镜像在 runner 上没有落盘(load 只能单平台), 所以只有 PR 在这里跑;
        # push 构建的 smoke test 在 tarball 任务的 amd64 镜像上做。
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          tag=$(echo '${{ steps.meta.outputs.tags }}' | head -n1)
          echo "smoke testing $tag"
          trap 'docker rm -f radio-smoke >/dev/null 2>&1 || true' EXIT
          # SIGN_KEY 只影响上游签名, /healthz 不需要真实密钥
          docker run -d --name radio-smoke -p 18090:7680 -e SIGN_KEY=smoke-test-not-a-real-key "$tag" >/dev/null
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18090/healthz >/dev/null 2>&1; then
              curl -fsS http://127.0.0.1:18090/healthz
              echo
              echo "smoke test passed"
              exit 0
            fi
            sleep 1
          done
          echo "::group::container logs"
          docker logs radio-smoke 2>&1 || true
          echo "::endgroup::"
          echo "::error::/healthz never answered within 30s"
          exit 1

  tarball:
    # 家用路由器/NAS 常常拉不动 ghcr.io: 每个架构单独出一个 docker save 的 tar.gz,
    # 下载后 docker load -i 即可, 全程不需要 registry。
    name: Offline tarball ${{ matrix.arch }}
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image name
        run: echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ${{ matrix.arch }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build locally
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:tarball-${{ matrix.arch }}
          cache-from: type=gha,scope=radio-cn-sign

      - name: Smoke test
        # arm64 镜像只能靠 QEMU 运行 alpine 里的 python, 太慢且容易假失败, 只验 amd64
        if: matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          tag="${{ env.IMAGE_NAME }}:tarball-amd64"
          trap 'docker rm -f radio-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name radio-smoke -p 18090:7680 -e SIGN_KEY=smoke-test-not-a-real-key "$tag" >/dev/null
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18090/healthz >/dev/null 2>&1; then
              curl -fsS http://127.0.0.1:18090/healthz
              echo
              echo "smoke test passed"
              exit 0
            fi
            sleep 1
          done
          echo "::group::container logs"
          docker logs radio-smoke 2>&1 || true
          echo "::endgroup::"
          echo "::error::/healthz never answered within 30s"
          exit 1

      - name: Save image to tar.gz
        run: |
          set -euo pipefail
          docker save "${{ env.IMAGE_NAME }}:tarball-${{ matrix.arch }}" | gzip -9 > radio-cn-sign-${{ matrix.arch }}.tar.gz
          ls -lh radio-cn-sign-${{ matrix.arch }}.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: radio-cn-sign-${{ matrix.arch }}-${{ github.sha }}
          path: radio-cn-sign-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 14
