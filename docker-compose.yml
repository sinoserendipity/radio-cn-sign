services:
  radio-cn-sign:
    # 用 CI 构建好的多架构镜像。这里**故意不写 build:**——否则 compose 在本地没有镜像时
    # 会去当前目录找 Dockerfile 构建，换个目录部署就报 "open Dockerfile: no such file"。
    # 要从源码构建，见 docker-compose.build.yml。
    image: ghcr.io/sinoserendipity/radio-cn-sign:latest
    pull_policy: always
    container_name: radio-cn-sign
    restart: unless-stopped
    # OpenWrt/iStoreOS 上 compose 自建 bridge 常无外网(DNS/转发问题), 用默认 bridge 最稳
    network_mode: bridge
    ports:
      # 宿主机端口:容器端口。7680 是当前部署用的宿主端口
      - "7680:7680"
    environment:
      # 由同目录 .env 提供(参考 .env.example); 不要写死在这里, 更不要提交
      SIGN_KEY: "${SIGN_KEY:?set SIGN_KEY in .env}"
      API_BASE: "https://ytmsout.radio.cn"
      RESIGN_WINDOW: "120"     # 同一频道复用已签地址的最长秒数(令牌实测有效 ≥45 分钟)
      CATALOG_TTL: "900"       # 频道表全量刷新间隔(秒)
      # 下面几个用默认值即可, 需要时再放开
      # BUILD_WAIT: "8"          # 目录构建中单个请求最多等多久(秒), 需小于客户端 12s 超时
      # BUILD_CONCURRENCY: "8"   # 建目录时的并发抓取数
      # REBUILD_COOLDOWN: "300"  # 目录失效重建的冷却(秒)
      # BUILD_RETRY_GAP: "20"    # 建表失败后的重试间隔(秒)
      # PL_REUSE: "5"            # probe 后复用播放列表的秒数
      LOG_REQUESTS: "1"
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"
